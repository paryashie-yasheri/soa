services:
  database:
    image: postgres:16-alpine
    container_name: soa-lab2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: soa
      POSTGRES_USER: soa
      POSTGRES_PASSWORD: ${DB_PASSWORD:-soa-local}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - soa-lab2-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soa -d soa"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  soa-lab2-data:
