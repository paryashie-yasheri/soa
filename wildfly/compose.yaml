services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: soa
      POSTGRES_USER: soa
      POSTGRES_PASSWORD: soa-local
    volumes:
      - ../database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "psql -U soa -d soa -tAc \"SELECT 1 FROM information_schema.schemata WHERE schema_name='s389491'\" | grep -q 1"]
      interval: 3s
      timeout: 3s
      retries: 40

  app:
    build:
      context: ..
      dockerfile: wildfly/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SOA_TEST_HTTPS_PORT:-62811}:61811"

