services:
  consul:
    image: hashicorp/consul:1.20
    command: agent -dev -client=0.0.0.0 -ui
    ports:
      - "127.0.0.1:18500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: soa
      POSTGRES_USER: soa
      POSTGRES_PASSWORD: soa-local
    volumes:
      - ../database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "psql -U soa -d soa -tAc \"SELECT 1 FROM information_schema.schemata WHERE schema_name='s389491'\" | grep -q 1"]
      interval: 3s
      timeout: 3s
      retries: 40

  app:
    build:
      context: ..
      dockerfile: wildfly/Dockerfile
      args:
        SOA_HTTPS_REDIRECT_PORT: ${SOA_TEST_HTTPS_PORT:-62811}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      consul:
        condition: service_healthy
    environment:
      SOA_CONSUL_URL: http://consul:8500
      SOA_CONSUL_SERVICE_ADDRESS: app
      SOA_CONSUL_SERVICE_PORT: 61811
    ports:
      - "127.0.0.1:${SOA_TEST_HTTP_PORT:-62810}:61810"
      - "127.0.0.1:${SOA_TEST_HTTPS_PORT:-62811}:61811"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--insecure", "--max-time", "8", "https://localhost:61811/organizations"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 5m

  orgdirectory1:
    build:
      context: ..
      dockerfile: spring-orgdirectory-service/docker/Dockerfile
    environment:
      SERVER_PORT: 8080
      ORGANIZATION_SERVICE_URL: https://app:61811
      CONSUL_HTTP_ADDR: http://consul:8500
    depends_on:
      app:
        condition: service_healthy
      consul:
        condition: service_healthy
    ports:
      - "127.0.0.1:61813:8080"
    healthcheck:
      # The Temurin JRE image has no curl. Check that Spring has bound its HTTP port;
      # Compose bounds the check with timeout/retries and the finite start_period.
      test: ["CMD-SHELL", "grep -Eq ':1F90[[:space:]]+[^[:space:]]+[[:space:]]+0A([[:space:]]|$)' /proc/net/tcp /proc/net/tcp6"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 3m

  orgdirectory2:
    build:
      context: ..
      dockerfile: spring-orgdirectory-service/docker/Dockerfile
    environment:
      SERVER_PORT: 8080
      ORGANIZATION_SERVICE_URL: https://app:61811
      CONSUL_HTTP_ADDR: http://consul:8500
    depends_on:
      app:
        condition: service_healthy
      consul:
        condition: service_healthy
    ports:
      - "127.0.0.1:61814:8080"
    healthcheck:
      test: ["CMD-SHELL", "grep -Eq ':1F90[[:space:]]+[^[:space:]]+[[:space:]]+0A([[:space:]]|$)' /proc/net/tcp /proc/net/tcp6"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 3m

  haproxy:
    image: haproxy:3.1-alpine
    volumes:
      - ../haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ../tls/haproxy.pem:/usr/local/etc/haproxy/haproxy.pem:ro
    depends_on:
      orgdirectory1:
        condition: service_healthy
      orgdirectory2:
        condition: service_healthy
    ports:
      - "127.0.0.1:62812:8080"

