global
  log stdout format raw local0
  maxconn 2048

defaults
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 30s
  timeout server 30s

frontend orgdirectory_http
  bind :8080 ssl crt /usr/local/etc/haproxy/haproxy.pem
  http-request replace-path ^/orgdirectory/?(.*)$ /\1
  default_backend orgdirectory_instances

backend orgdirectory_instances
  balance roundrobin
  option httpchk GET /order/name/false
  http-check expect status 200
  server orgdirectory1 orgdirectory1:8080 check
  server orgdirectory2 orgdirectory2:8080 check
