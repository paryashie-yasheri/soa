global
  log stdout format raw local0
  maxconn 2048

defaults
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 30s
  timeout server 30s

frontend orgdirectory_http
  bind :8080 ssl crt /usr/local/etc/haproxy/haproxy.pem
  acl is_orgdirectory path_beg /orgdirectory
  use_backend orgdirectory_instances if is_orgdirectory
  default_backend wildfly_application

backend orgdirectory_instances
  http-request replace-path ^/orgdirectory/?(.*)$ /\1
  balance roundrobin
  option httpchk GET /health
  http-check expect status 200
  server orgdirectory1 orgdirectory1:8080 check
  server orgdirectory2 orgdirectory2:8080 check

backend wildfly_application
  option httpchk GET /organizations
  http-check expect status 200
  server wildfly app:61811 ssl verify none check
