global
  log stdout format raw local0
  maxconn 2048

defaults
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 30s
  timeout server 30s

frontend orgdirectory_https
  bind :61815 ssl crt @@DIR@@/tls/haproxy.pem
  http-request set-header X-Forwarded-Proto https
  acl is_orgdirectory path_beg /orgdirectory
  use_backend orgdirectory_instances if is_orgdirectory
  default_backend wildfly_application

backend orgdirectory_instances
  http-request replace-path ^/orgdirectory/?(.*)$ /\1
  balance roundrobin
  server-template orgdirectory 1-10 _soa-orgdirectory._tcp.service.consul resolvers consul resolve-opts allow-dup-ip resolve-prefer ipv4 init-addr none

backend wildfly_application
  server wildfly 127.0.0.1:61811 ssl verify none

resolvers consul
  nameserver consul 127.0.0.1:61822
  accepted_payload_size 8192
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 2s
  hold obsolete 2s
  hold nx 2s
