openapi: 3.0.3

info:
  title: OrgDirectory Service
  version: 1.0.0
  description: |
    Второй веб-сервис работает по URL `/orgdirectory`.

    Сервис вызывает API первого сервиса (Organization Service), чтобы
    фильтровать организации по количеству сотрудников и сортировать их по
    заданному полю. У каждой операции отдельный URL.

    Параметры операций передаются в URL запроса. Сервис возвращает данные
    в формате XML (`application/xml`).

servers:
  - url: https://{host}:{port}/orgdirectory
    variables:
      host:
        default: se.ifmo.ru
        description: Хост сервера
      port:
        default: "443"
        description: Порт сервиса

security: []

tags:
  - name: Directory
    description: Дополнительные операции над организациями

paths:
  /filter/employees/{min-employees-count}/{max-employees-count}:
    get:
      tags: [Directory]
      operationId: filterByEmployeesCount
      summary: Отфильтровать организации по количеству сотрудников
      description: |
        Возвращает организации, у которых число сотрудников находится в диапазоне
        от `min-employees-count` до `max-employees-count` включительно. Если
        минимум больше максимума, сервис возвращает `400 Bad Request`.
      parameters:
        - name: min-employees-count
          in: path
          required: true
          description: Минимальное количество сотрудников (включительно); должно быть не больше максимума.
          schema:
            type: integer
            format: int32
            minimum: 0
        - name: max-employees-count
          in: path
          required: true
          description: Максимальное количество сотрудников (включительно); должно быть не меньше минимума.
          schema:
            type: integer
            format: int32
            minimum: 0
      responses:
        '200':
          description: Список организаций, удовлетворяющих условию
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/OrganizationList'
              example: |
                <?xml version="1.0" encoding="UTF-8"?>
                <organizations>
                  <total>1</total>
                  <organization id="1">
                    <name>Acme</name>
                    <coordinates>
                      <x>12.5</x>
                      <y>34</y>
                    </coordinates>
                    <creationDate>2024-03-01</creationDate>
                    <annualTurnover>1000000</annualTurnover>
                    <fullName>Acme Corporation</fullName>
                    <type>COMMERCIAL</type>
                    <postalAddress>
                      <street>Main street</street>
                    </postalAddress>
                  </organization>
                </organizations>
        '400':
          description: Некорректные параметры диапазона (например, min больше max)
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Organization Service вернул ошибочный ответ, который OrgDirectory не может обработать
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
              example: |
                <?xml version="1.0" encoding="UTF-8"?>
                <error>
                  <code>502</code>
                  <message>Organization Service вернул ошибочный ответ</message>
                </error>
        '504':
          description: Истекло время ожидания ответа от Organization Service
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
              example: |
                <?xml version="1.0" encoding="UTF-8"?>
                <error>
                  <code>504</code>
                  <message>Истекло время ожидания ответа от Organization Service</message>
                </error>
        '404':
          $ref: '#/components/responses/EndpointNotFound'

  /order/{param-name}/{desc}:
    get:
      tags: [Directory]
      operationId: orderOrganizations
      summary: Вывести список организаций, отсортированных по заданному полю
      description: |
        Сортирует организации по полю `param-name`. `desc` принимает только
        строку `true` (по убыванию) или `false` (по возрастанию). Любое иное
        значение приводит к ответу `400 Bad Request`.
      parameters:
        - name: param-name
          in: path
          required: true
          description: Имя поля организации, по которому выполняется сортировка
          schema:
            type: string
            enum:
              - id
              - name
              - coordinates.x
              - coordinates.y
              - creationDate
              - annualTurnover
              - fullName
              - type
              - postalAddress.street
        - name: desc
          in: path
          required: true
          description: Только `true` (по убыванию) или `false` (по возрастанию); любое другое значение приводит к 400 Bad Request.
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        '200':
          description: Отсортированный список организаций
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/OrganizationList'
        '400':
          description: Неизвестное поле или направление сортировки
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Organization Service вернул ошибочный ответ, который OrgDirectory не может обработать
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
              example: |
                <?xml version="1.0" encoding="UTF-8"?>
                <error>
                  <code>502</code>
                  <message>Organization Service вернул ошибочный ответ</message>
                </error>
        '504':
          description: Истекло время ожидания ответа от Organization Service
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
              example: |
                <?xml version="1.0" encoding="UTF-8"?>
                <error>
                  <code>504</code>
                  <message>Истекло время ожидания ответа от Organization Service</message>
                </error>
        '404':
          $ref: '#/components/responses/EndpointNotFound'

components:
  responses:
    EndpointNotFound:
      description: Запрошенный путь не найден
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          example: |
            <?xml version="1.0" encoding="UTF-8"?>
            <error>
              <code>404</code>
              <message>Запрошенная ручка не найдена</message>
            </error>

  schemas:
    Organization:
      type: object
      xml:
        name: organization
      required:
        - id
        - name
        - coordinates
        - creationDate
        - type
        - postalAddress
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          readOnly: true
          description: Уникальный идентификатор, генерируется автоматически
          xml:
            attribute: true
        name:
          type: string
          minLength: 1
          description: Имя организации. Не допускает null или пустую строку.
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        creationDate:
          type: string
          format: date
          readOnly: true
          description: Дата создания, генерируется автоматически
        annualTurnover:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: Годовой оборот. Может быть null; если задан, должен быть больше 0.
        fullName:
          type: string
          nullable: true
          description: Полное наименование. Может быть null.
        type:
          $ref: '#/components/schemas/OrganizationType'
        postalAddress:
          $ref: '#/components/schemas/Address'

    Coordinates:
      type: object
      xml:
        name: coordinates
      required:
        - x
        - y
      properties:
        x:
          type: number
          format: float
          description: Координата X
        y:
          type: integer
          format: int64
          description: Координата Y

    Address:
      type: object
      xml:
        name: postalAddress
      required:
        - street
      properties:
        street:
          type: string
          maxLength: 158
          description: Улица. Не допускает null; длина не больше 158 символов.

    OrganizationType:
      type: string
      description: Тип организации
      enum:
        - COMMERCIAL
        - TRUST
        - PRIVATE_LIMITED_COMPANY
        - OPEN_JOINT_STOCK_COMPANY

    OrganizationList:
      type: object
      description: OrgDirectory возвращает весь результат без разбивки на страницы. total содержит число возвращённых организаций. Полей page и size нет, поскольку операции не принимают параметры пагинации.
      xml:
        name: organizations
      required:
        - total
      properties:
        total:
          type: integer
          format: int64
          description: Число организаций во всём результате без разбивки на страницы
        items:
          type: array
          xml:
            name: organization
            wrapped: false
          items:
            $ref: '#/components/schemas/Organization'

    Error:
      type: object
      xml:
        name: error
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: HTTP-код ошибки
        message:
          type: string
          description: Сообщение об ошибке
