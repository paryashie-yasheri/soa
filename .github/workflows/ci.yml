name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, unit tests, e2e and OpenAPI examples
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node.js (Swagger UI vendor)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python (OpenAPI example runner)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: e2e-tests/requirements.txt

      - name: Install Python dependencies
        run: pip install -r e2e-tests/requirements.txt

      - name: Prime Docker base images
        run: |
          docker pull quay.io/wildfly/wildfly:35.0.1.Final-jdk21
          docker pull postgres:16-alpine

      - name: Build, tests and OpenAPI examples
        run: ./gradlew build :e2e-tests:openapiExamples

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/
            **/build/test-results/